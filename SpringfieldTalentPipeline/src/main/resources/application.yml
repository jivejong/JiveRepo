spring:
  application:
    name: springfield-talent-pipeline

  config:
    # Local developer overrides (DB password, Gemini key) live in a gitignored file so nothing
    # secret is committed. "optional:" means the app starts normally when it is absent, so CI
    # and a fresh clone work with environment variables alone.
    # Copy config/local.yml.example to config/local.yml to use it.
    import: optional:file:./config/local.yml

  datasource:
    # Every value here is env-overridable so nothing environment-specific is committed.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springfield}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Hibernate manages the schema until/unless
      # Flyway migrations are added under src/main/resources/db/migration —
      # see docs/IMPLEMENTATION_PLAN.md, where schema versioning is optional for v1.
      ddl-auto: update
    open-in-view: false
    show-sql: false
    # Lets data.sql run after Hibernate has created the tables, so the full-text index in it has
    # a candidate table to attach to.
    defer-datasource-initialization: true

  sql:
    init:
      # Defaults to "embedded", which would skip data.sql entirely against Postgres.
      mode: always
      # Naming these explicitly replaces the default classpath:data.sql, so data.sql must be listed
      # too. The wage seed is separate because it is 831 rows of reference data rather than schema.
      data-locations: classpath:data.sql, classpath:db/occupation_wage_seed.sql

management:
  endpoints:
    web:
      exposure:
        # Phase 0 checkpoint: GET /actuator/health must respond, and its db indicator
        # reports whether the local Postgres connection is actually live.
        include: health
  endpoint:
    health:
      show-details: always

# The Simpsons API - no auth of any kind. See docs/SIMPSONS_API.md.
simpsons:
  base-url: https://thesimpsonsapi.com/api
  # Confirmed against the live CDN (the spec said not to guess): widths 200, 500 and 1280 serve
  # {cdn-base-url}/character/{id}.webp
  cdn-base-url: https://cdn.thesimpsonsapi.com/500
  # ~60 pages x this delay is the floor on a full sync. Deliberate politeness, not a bug.
  page-delay: 200ms
  connect-timeout: 10s
  read-timeout: 30s

# Gemini API (via its OpenAI-compatible endpoint) — key comes from the GEMINI_API_KEY environment
# variable or config/local.yml, never from this file. See docs/AI_FEATURES.md for the model choices.
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta/openai
  models:
    profile: gemini-3.1-flash-lite
    interview: gemini-3.1-flash-lite
  # Gemini 3 models think before replying and thinking tokens count against max-completion-tokens;
  # left at the default that blows past the token estimates in docs/AI_FEATURES.md for reasoning
  # neither feature surfaces.
  reasoning-effort: low
  temperature:
    # Measured: at 0.4 the same candidate/role scored anywhere from 20 to 70 across repeated runs.
    # A cached fit score should not depend on when it was generated.
    profile: 0.1
    interview: 0.8
  max-completion-tokens: 3000
  connect-timeout: 10s
  read-timeout: 120s

logging:
  level:
    com.jivejong.springfieldtalentpipeline: INFO
