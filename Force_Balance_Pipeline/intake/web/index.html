<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a disturbance</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/main.js"></script>
</head>
<body>
  <main>
    <h1>Report a disturbance in the Force</h1>
    <p class="lede">Tell the Council what you saw. A model reads your report and estimates what the Force sensors on that planet would have shown.</p>

    <form id="report-form" autocomplete="off" novalidate>
      <label for="planet">Planet</label>
      <select id="planet" name="planet">
        <option value="">Loading planets...</option>
      </select>

      <label for="description">What did you see?</label>
      <textarea id="description" name="description" rows="6" maxlength="8000"></textarea>
      <p id="counter" class="counter">0 / 8000</p>

      <button type="submit" id="submit">Send report</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <section id="confirmation" hidden aria-live="polite"></section>

    <section>
      <h2>Recent reports for this planet</h2>
      <p id="recent-note"></p>
      <ul id="recent-list"></ul>
    </section>

    <section>
      <h2>On this device</h2>
      <p id="queue-status">Nothing is waiting to be sent.</p>
      <ul id="queue-list"></ul>
    </section>
  </main>
</body>
</html>
