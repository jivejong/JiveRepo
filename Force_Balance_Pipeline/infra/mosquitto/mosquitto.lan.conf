# The Phase 3 staging broker (docs 04 and 05): authenticated, with per-user topic permissions, and no TLS.
#
# Docker publishes port 1883 on the desktop's LAN address and on 127.0.0.1, never on 0.0.0.0 (see the run command in doc 05), and a
# Windows Firewall rule admits it from the Pi's address only. Inside the container the listener binds every interface; the container's
# network namespace is not exposed except through those two published addresses.
#
# The password file lives OUTSIDE the repository (~/.force_balance_pipeline/mosquitto/passwd, mounted at /mosquitto/secrets). The ACL file,
# which holds usernames and topics but no secrets, is committed next to this file and mounted at /mosquitto/config.
#
# Passwords cross the LAN in clear text: TLS, and the e2-micro, come together in a later phase.
listener 1883
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

# Persistent sessions: the bridge connects with a fixed client id and clean_session=false, so while it is down or restarting the broker
# queues its QoS 1 messages. max_queued_messages 50000 is about 8 days of scans (60 events every 15 minutes).
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 50000
persistent_client_expiration 7d
log_dest stdout
