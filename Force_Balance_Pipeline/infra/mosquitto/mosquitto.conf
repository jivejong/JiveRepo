# Local-only broker for single-machine development (docs 04, 05). NOT a production config.
#
# Anonymous access is acceptable here only because the container's port is published on 127.0.0.1
# alone (docker run -p 127.0.0.1:1883:1883). The authenticated broker the Pi connects to in Phase 3 is
# mosquitto.lan.conf; TLS and the e2-micro come together in a later phase (OPEN note in doc 04).
#
# Mosquitto 2 refuses remote connections unless a listener is declared and allow_anonymous is explicit.
listener 1883
allow_anonymous true

# Persistent sessions: the bridge connects with a fixed client id and clean_session=false, so while it is
# down or restarting the broker queues its QoS 1 messages and delivers them when it reconnects.
#   persistence          keep sessions and queued messages across a broker restart (written on a clean
#                        stop and every autosave_interval seconds)
#   max_queued_messages  the default is 1000 per client (about 16 scans); 50000 is about 8 days of scans
#                        (60 events every 15 minutes), so an overnight bridge restart loses nothing
#   persistent_client_expiration  a session nobody reconnects to (an abandoned test client id) is dropped
#   max_inflight_messages  the default is 20. The bridge acknowledges a message only after the file holding it has
#                        landed, and a scan is 60 events, so a window of 20 stalls delivery until the bridge's 90 s
#                        timer. 180 is three scans (doc 05, "Broker persistence and the bridge session"). The
#                        throwaway broker of ingest/e2e_local.py reads this file; mosquitto.lan.conf must say the same.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_queued_messages 50000
persistent_client_expiration 7d
max_inflight_messages 180
log_dest stdout
