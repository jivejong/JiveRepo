          - {event_id: "01UNIT0000000000000006031", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "uncharted", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006032", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: null, schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006033", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "naboo", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", is_unknown: false}
          - {sector_id: "naboo", is_unknown: false}
          - {sector_id: "uncharted", is_unknown: true}
    expect:
      rows:
        - {event_id: "01UNIT0000000000000006030", reject_reason: "unknown_sector"}
        - {event_id: "01UNIT0000000000000006031", reject_reason: "unknown_sector"}
        - {event_id: "01UNIT0000000000000006032", reject_reason: "unknown_sector"}

  - name: unit_test_report_null_required_field
    description: >
      No channel is optional for a report (there is no STEALTH): any null channel, a null relevance, and a missing or
      blank description (null, empty, or whitespace only) are rejected. A description with spaces around real text is valid.
    model: silver_report_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - {event_id: "01UNIT0000000000000006040", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: null, relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
