version: 2

unit_tests:
  # Housekeeping routing (e): a payload.kind row lands in silver_probe_event, never in silver_rejects, even
  # though its sector_id (source_id) is not a real dim_sector row -- routed before the sector check (doc 02/03).
  - name: unit_test_a_housekeeping_event_routes_to_silver_probe_event
    model: silver_probe_event
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - event_id: "01UNIT0000000000000000010"
            source_type: "probe"
            sector_id: "probe-01"
            arrival_ts: "2026-09-30T12:00:00Z"
            kind: "buffer_overflow"
    expect:
      rows:
        - event_id: "01UNIT0000000000000000010"
          kind: "buffer_overflow"

  - name: unit_test_a_housekeeping_event_never_reaches_silver_rejects
    model: silver_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - event_id: "01UNIT0000000000000000010"
            source_type: "probe"
            sector_id: "probe-01"          # not a real dim_sector row -- would be unknown_sector if not routed away first
            kind: "buffer_overflow"
      - input: ref('dim_sector')
        rows: []                           # deliberately empty: this row must never reach the sector check at all
    expect:
      rows: []

  # impossible_timestamp bounds (d): future_tolerance_minutes=10, max_age_days=90 (dbt_project.yml vars).
  # 9/11 minutes bracket the future edge; 89/91 days bracket the old edge. ingest_lag_seconds is supplied
  # directly, the way stg_bronze_events would really compute it (arrival_ts - event_time in seconds); the
  # "valid" row in each pair also needs realistic channel values so it doesn't fail null_required_field
  # instead and end up counted here by a different reason.
  - name: unit_test_impossible_timestamp_future_bound
    model: silver_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - event_id: "01UNIT0000000000000000020"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            schema_version: 1
            ingest_lag_seconds: -540    # 9 min ahead of arrival -- valid
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
          - event_id: "01UNIT0000000000000000021"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            schema_version: 1
            ingest_lag_seconds: -660    # 11 min ahead -- impossible_timestamp
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
      - input: ref('dim_sector')
        rows:
          - sector_id: "tatooine"
    expect:
      rows:
        - event_id: "01UNIT0000000000000000021"
          reject_reason: "impossible_timestamp"

  - name: unit_test_impossible_timestamp_old_bound
    model: silver_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - event_id: "01UNIT0000000000000000022"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            schema_version: 1
            ingest_lag_seconds: 7689600    # 89 days behind -- valid
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
          - event_id: "01UNIT0000000000000000023"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            schema_version: 1
            ingest_lag_seconds: 7862400    # 91 days behind -- impossible_timestamp
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
      - input: ref('dim_sector')
        rows:
          - sector_id: "tatooine"
    expect:
      rows:
        - event_id: "01UNIT0000000000000000023"
          reject_reason: "impossible_timestamp"

  # is_replayed boundary (g): strict `>` at replay_lag_seconds=1800 -- 1,800 itself is NOT replayed.
  # silver_probe_reading now refs BOTH stg_bronze_events and silver_rejects (the complement-of-rejects
  # design, see the model's header) -- an empty silver_rejects fixture tells the unit test none of these
  # three rows were rejected, so all three reach the "valid" CTE.
  - name: unit_test_is_replayed_1799_1800_1801_boundary
    model: silver_probe_reading
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - event_id: "01UNIT0000000000000000030"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            ingest_lag_seconds: 1799
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
          - event_id: "01UNIT0000000000000000031"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            ingest_lag_seconds: 1800
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
          - event_id: "01UNIT0000000000000000032"
            source_type: "probe"
            sector_id: "tatooine"
            mode: "CONNECTED"
            ingest_lag_seconds: 1801
            midichlorian_ppm: 15000.0
            kyber_resonance: 50.0
            dark_side_activity: 20.0
      - input: ref('silver_rejects')
        rows: []
    expect:
      rows:
        - event_id: "01UNIT0000000000000000030"
          is_replayed: false
        - event_id: "01UNIT0000000000000000031"
          is_replayed: false
        - event_id: "01UNIT0000000000000000032"
          is_replayed: true

  # ---- Phase 5: report validation (silver_report_rejects, silver_force_report) and probe/report separation ----
  - name: unit_test_report_valid_row_is_not_rejected
    description: >
      A fully valid report is not a reject.
    model: silver_report_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - {event_id: "01UNIT0000000000000006000", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", is_unknown: false}
          - {sector_id: "naboo", is_unknown: false}
          - {sector_id: "uncharted", is_unknown: true}
    expect:
      rows: []

  - name: unit_test_report_unknown_schema_version
    model: silver_report_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - {event_id: "01UNIT0000000000000006010", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 2, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006011", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", is_unknown: false}
          - {sector_id: "naboo", is_unknown: false}
          - {sector_id: "uncharted", is_unknown: true}
    expect:
      rows:
        - {event_id: "01UNIT0000000000000006010", reject_reason: "unknown_schema_version"}

  - name: unit_test_report_impossible_timestamp_bounds
    description: >
      report_future_tolerance_minutes=10 and report_max_age_days=7 (dbt_project.yml; parity-tested against
      intake_core.OBSERVED_*). The bounds are inclusive, like the intake's: 600 s ahead and exactly 7 days behind are valid.
    model: silver_report_rejects
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_bronze_events')
        rows:
          - {event_id: "01UNIT0000000000000006020", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: -600, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006021", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: -601, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006022", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 604800, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006023", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 604801, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006024", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 7862400, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: 50.0, dark_side_activity: 20.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", is_unknown: false}
          - {sector_id: "naboo", is_unknown: false}
          - {sector_id: "uncharted", is_unknown: true}
    expect:
      rows:
        - {event_id: "01UNIT0000000000000006021", reject_reason: "impossible_timestamp"}
        - {event_id: "01UNIT0000000000000006023", reject_reason: "impossible_timestamp"}
        - {event_id: "01UNIT0000000000000006024", reject_reason: "impossible_timestamp"}

  - name: unit_test_report_unknown_sector
