          - {event_id: "01UNIT0000000000000006044", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: null, kyber_resonance: 50.0, dark_side_activity: 20.0}
          - {event_id: "01UNIT0000000000000006045", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 0.9, midichlorian_ppm: 15000.0, kyber_resonance: null, dark_side_activity: 20.0}
