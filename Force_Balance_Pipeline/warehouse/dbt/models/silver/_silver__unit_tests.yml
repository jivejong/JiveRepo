          - {event_id: "01UNIT0000000000000006059", source_type: "report", kind: null, source_id: "web-a3f2", sector_id: "tatooine", schema_version: 1, event_time: "2026-10-14T14:59:00Z", arrival_ts: "2026-10-14T15:00:00Z", ingest_lag_seconds: 60, description: "Saw a figure in black robes.", relevance_score: 1.0, midichlorian_ppm: 30000.0, kyber_resonance: 100.0, dark_side_activity: 100.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", is_unknown: false}
          - {sector_id: "naboo", is_unknown: false}
          - {sector_id: "uncharted", is_unknown: true}
    expect:
      rows:
