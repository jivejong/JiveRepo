  - name: unit_test_disturbance_probe_walk_completes_at_depth_150
    description: >
      150 sustained probe runs in one sector, an hour apart (two scans over the threshold, then one under), are 150 links of walked's chain:
      more than the engine's default limit of 100, so this fails with a build error if the walk loses its MAX RECURSION LEVEL
      var('walk_recursion_limit'). Each run's cooldown (2 h from its last scan) swallows the next two, so 50 incidents come out.
      Slow (about 5 to 6 minutes when the two run together in dev); unit tests do not run in Job 1.
    model: gold_disturbance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('gold_sector_reading')
        format: sql
        rows: |
          select concat('01UNIT', lpad(cast(id * 3 + m.k as string), 19, '0')) as event_id, 'tatooine' as sector_id,
                 concat('01SCAN', lpad(cast(id * 3 + m.k as string), 19, '0')) as scan_id,
                 cast(timestamp'2026-01-01 00:00:00' + make_interval(0, 0, 0, 0, cast(id as int), cast(m.k * 15 as int), 0) as timestamp) as event_time,
                 'probe' as source_type, cast(case when m.k < 2 then 6.0 else 1.0 end as double) as imbalance_score,
                 cast(0.0 as double) as z_midi, cast(-1.0 as double) as z_kyber, cast(2.0 as double) as z_dark, 'sith_presence' as signature,
                 cast(3 as int) as channels_present, cast(false as boolean) as is_replayed
          from range(150) as t(id) cross join (select explode(array(0, 1, 2)) as k) m
      - input: ref('silver_force_report')
        rows: []
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 100000}
    expect:
      rows:
        - {sector_id: "tatooine", detected_at: "2026-01-01T00:15:00Z", is_report_sourced: false}
