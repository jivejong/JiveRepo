version: 2

unit_tests:
  # Every fixture here uses mean_90d=0, stddev_90d=1 for every channel, so z_channel = the raw reading value
  # directly (subtract 0, divide by 1) -- this makes constructing an exact target z-score combination as
  # simple as setting the raw reading to that number, with no arithmetic to get wrong in the fixture itself.

  # classify_signature: one row per signature, doc 03's own order, each picked so it does NOT also satisfy an
  # earlier rule in the table (proving first-match order, not just that each rule CAN fire in isolation).
  - name: unit_test_signature_sith_presence
    model: gold_sector_reading
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_probe_reading')
        rows:
          - {event_id: "01UNIT0000000000000000100", sector_id: "tatooine", scan_id: "01UNIT0000000000000000101", event_time: "2026-09-30T12:00:00Z", midichlorian_ppm: 0.0, kyber_resonance: -2.0, dark_side_activity: 3.0, channels_present: 3}
      - input: ref('silver_force_report')
        rows: []
      - input: ref('gold_sector_baseline')
        rows:
          - {sector_id: "tatooine", channel: "midichlorian", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "tatooine", channel: "kyber", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "tatooine", channel: "dark_side", mean_90d: 0.0, stddev_90d: 1.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 200000}
    expect:
      rows:
        - {sector_id: "tatooine", signature: "sith_presence"}

