  # gold_disturbance: these fixtures stub gold_sector_reading's own OUTPUT directly (imbalance_score,
  # signature already computed), since z-scoring is gold_sector_reading's job, already covered above --
  # these four are about the run-detection and cooldown logic gold_disturbance adds on top of it.

  - name: unit_test_disturbance_two_sustained_scans_fire
    description: "2 consecutive scans over the emergency threshold for one sector -- exactly one incident row."
    model: gold_disturbance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('gold_sector_reading')
        rows:
          - {event_id: "01UNIT0000000000000000200", sector_id: "tatooine", scan_id: "01UNIT0000000000000000201", event_time: "2026-09-30T12:00:00Z", imbalance_score: 6.0, z_midi: 0.0, z_kyber: -2.0, z_dark: 3.0, signature: "sith_presence", channels_present: 3, is_replayed: false}
          - {event_id: "01UNIT0000000000000000202", sector_id: "tatooine", scan_id: "01UNIT0000000000000000203", event_time: "2026-09-30T12:15:00Z", imbalance_score: 6.2, z_midi: 0.0, z_kyber: -2.1, z_dark: 3.1, signature: "sith_presence", channels_present: 3, is_replayed: false}
      - input: ref('silver_force_report')
        rows: []
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 200000}
    expect:
      rows:
        - {sector_id: "tatooine", signature: "sith_presence", sustained_scans: 2, cooldown_conflict: false}

  - name: unit_test_disturbance_one_scan_does_not_fire
    description: "A single scan over the emergency threshold, with no second consecutive scan -- no incident."
    model: gold_disturbance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('gold_sector_reading')
        rows:
          - {event_id: "01UNIT0000000000000000204", sector_id: "tatooine", scan_id: "01UNIT0000000000000000205", event_time: "2026-09-30T12:00:00Z", imbalance_score: 6.0, z_midi: 0.0, z_kyber: -2.0, z_dark: 3.0, signature: "sith_presence", channels_present: 3, is_replayed: false}
      - input: ref('silver_force_report')
        rows: []
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 200000}
    expect:
      rows: []

  - name: unit_test_disturbance_cooldown_suppresses_an_in_order_second_onset_no_conflict
    description: >
      Stage 4a, "definition B", case (a). Two separate sustained runs (each 2 consecutive scans) for the same
      sector, 30 minutes apart onset to onset -- doc 07 checkpoint C4's own fixture shape. A below-threshold
      scan between them breaks them into two distinct runs, not one continuous four-scan run. The cooldown
      suppresses the second run entirely (only one row in the output) -- but it arrives IN ORDER, is_replayed
      false on every row, so this is the cooldown working exactly as designed, not a conflict:
      cooldown_conflict stays false. (Before Stage 4a, this test asserted cooldown_conflict: true for this
      same ordinary, non-replayed case -- that was the doc 03 / implementation mismatch "definition B" fixes.)
    model: gold_disturbance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('gold_sector_reading')
        rows:
          - {event_id: "01UNIT0000000000000000206", sector_id: "tatooine", scan_id: "01UNIT0000000000000000207", event_time: "2026-09-30T12:00:00Z", imbalance_score: 6.0, z_midi: 0.0, z_kyber: -2.0, z_dark: 3.0, signature: "sith_presence", channels_present: 3, is_replayed: false}
          - {event_id: "01UNIT0000000000000000208", sector_id: "tatooine", scan_id: "01UNIT0000000000000000209", event_time: "2026-09-30T12:15:00Z", imbalance_score: 6.1, z_midi: 0.0, z_kyber: -2.0, z_dark: 3.0, signature: "sith_presence", channels_present: 3, is_replayed: false}
          - {event_id: "01UNIT0000000000000000210", sector_id: "tatooine", scan_id: "01UNIT0000000000000000211", event_time: "2026-09-30T12:30:00Z", imbalance_score: 1.0, z_midi: 0.0, z_kyber: 0.0, z_dark: 0.5, signature: "unclassified", channels_present: 3, is_replayed: false}
          - {event_id: "01UNIT0000000000000000212", sector_id: "tatooine", scan_id: "01UNIT0000000000000000213", event_time: "2026-09-30T12:45:00Z", imbalance_score: 6.0, z_midi: 0.0, z_kyber: -2.0, z_dark: 3.0, signature: "sith_presence", channels_present: 3, is_replayed: false}
          - {event_id: "01UNIT0000000000000000214", sector_id: "tatooine", scan_id: "01UNIT0000000000000000215", event_time: "2026-09-30T13:00:00Z", imbalance_score: 6.1, z_midi: 0.0, z_kyber: -2.0, z_dark: 3.0, signature: "sith_presence", channels_present: 3, is_replayed: false}
      - input: ref('silver_force_report')
        rows: []
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 200000}
    expect:
      rows:
        - {sector_id: "tatooine", detected_at: "2026-09-30T12:15:00Z", sustained_scans: 2, cooldown_conflict: false}

  - name: unit_test_disturbance_third_rapid_run_is_accepted
    description: >
      Regression test for the LAG()-based cooldown bug fixed 2026-09-30 (see gold_disturbance's own header,
      "Cooldown -- RESOLVED"). Run 1 (00:00-00:15) is accepted. Run 2 (00:45-02:30, deliberately long -- 8
      consecutive scans) onsets inside run 1's cooldown (ends 02:15) and is correctly suppressed under either
      scheme, but its own detected_at (02:30) lands AFTER run 1's cooldown ends. Run 3 (03:00-03:15) onsets
      clear of run 1's true cooldown (03:00 > 02:15) but still inside what run 2's own detected_at + 2h would
      imply (03:00 < 04:30). The old LAG()-based check compared run 3 against run 2's detected_at regardless of
      run 2's own suppression and wrongly suppressed it; the recursive walk compares run 3 against the last
      ACCEPTED incident (run 1, detected_at 00:15, cooldown ends 02:15) and correctly accepts it. Expect run 1
      and run 3 as two separate incidents, run 3 not flagged (nothing was suppressed against it). Every row is
      is_replayed: false -- this test is about the LAG-vs-recursive-walk mechanics, not replay detection, so
      under "definition B" (Stage 4a) run 1 is NOT flagged either: run 2's suppression is ordinary, in-order,
      not a replay (contrast unit_test_disturbance_cooldown_replayed_onset_flags_the_existing_incident, below,
      which is the same shape with run 2 replayed).
    model: gold_disturbance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('gold_sector_reading')
        rows:
