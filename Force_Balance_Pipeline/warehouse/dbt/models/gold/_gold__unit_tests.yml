  # imbalance_score: a full row (three channels), a dark-only STEALTH row (one channel, doubled weight,
  # SQRT(3/1) scaling), and a row with NULL channels producing a non-NULL score (COALESCE-to-zero per term,
  # doc 03).
  - name: unit_test_imbalance_score_full_row
    description: "z = (1, 1, 1) on all three channels: SQRT(1 + 1 + 2) * SQRT(3/3) = SQRT(4) = 2.0."
    model: gold_sector_reading
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_probe_reading')
        rows:
          - {event_id: "01UNIT0000000000000000120", sector_id: "tatooine", scan_id: "01UNIT0000000000000000121", event_time: "2026-09-30T12:00:00Z", midichlorian_ppm: 1.0, kyber_resonance: 1.0, dark_side_activity: 1.0, channels_present: 3}
