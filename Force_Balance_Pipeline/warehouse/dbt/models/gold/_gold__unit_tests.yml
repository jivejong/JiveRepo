      - input: ref('gold_sector_baseline')
        rows:
          - {sector_id: "naboo", channel: "midichlorian", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "naboo", channel: "kyber", mean_90d: 0.0, stddev_90d: 1.0}
