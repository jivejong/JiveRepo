  # veiled_presence NULL grid (b): COALESCE(ABS(z_midi), 0) < 1.0, not plain ABS(z_midi) < 1.0 -- a STEALTH
  # row's missing midichlorian_ppm (and so missing z_midi) satisfies this one zero-bound condition; every
  # directional condition elsewhere is still NULL, still false. Mirrors
  # edge/tests/test_doc_parity.py's own grid case at (None, -4.0, 2.5, None, 1).
  - name: unit_test_veiled_presence_fires_with_a_missing_z_midi
    model: gold_sector_reading
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('silver_probe_reading')
        rows:
          - {event_id: "01UNIT0000000000000000114", sector_id: "naboo", scan_id: "01UNIT0000000000000000115", event_time: "2026-09-30T12:00:00Z", midichlorian_ppm: null, kyber_resonance: null, dark_side_activity: 2.5, channels_present: 1}
      - input: ref('silver_force_report')
        rows: []
      - input: ref('gold_sector_baseline')
        rows:
          - {sector_id: "naboo", channel: "midichlorian", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "naboo", channel: "kyber", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "naboo", channel: "dark_side", mean_90d: 0.0, stddev_90d: 1.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "naboo", population: 4500000000}
    expect:
      rows:
        - {sector_id: "naboo", signature: "veiled_presence"}

