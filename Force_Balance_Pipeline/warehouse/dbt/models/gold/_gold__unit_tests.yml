    expect:
      rows:
        - {sector_id: "naboo", imbalance_score: 4.898979485566357}

  - name: unit_test_imbalance_score_null_channels_still_non_null_score
    description: "Both midi and kyber NULL (STEALTH), dark present: COALESCE-to-zero per term keeps the score computable, never NULL, even though two of three inputs are missing."
    model: gold_sector_reading
    overrides:
