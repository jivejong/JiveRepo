  # ---- Phase 5: the recursive walks at depth (gold_disturbance) ----

  - name: unit_test_disturbance_report_walk_completes_at_depth_150
    description: >
      150 qualifying reports in one sector, an hour apart, are 150 links of report_walk's chain: more than the engine's default limit of 100,
      so this fails with a build error if the walk loses its MAX RECURSION LEVEL var('walk_recursion_limit'). The last-accepted walk still holds at
      depth: each report is absorbed by the cooldown of the one before it except every second one, so 75 incidents come out. Slow (about 5 to 6 minutes when the
      two run together in dev); unit tests do not run in Job 1.
    model: gold_disturbance
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('gold_sector_reading')
        format: sql
        rows: |
          select concat('01UNIT', lpad(cast(id as string), 19, '0')) as event_id, 'tatooine' as sector_id, cast(null as string) as scan_id,
                 cast(timestamp'2026-01-01 00:00:00' + make_interval(0, 0, 0, 0, cast(id as int), 0, 0) as timestamp) as event_time, 'report' as source_type, cast(8.0 as double) as imbalance_score,
                 cast(0.0 as double) as z_midi, cast(-1.0 as double) as z_kyber, cast(2.0 as double) as z_dark, 'sith_presence' as signature,
                 cast(3 as int) as channels_present, cast(false as boolean) as is_replayed
          from range(150) as t(id)
      - input: ref('silver_force_report')
        format: sql
        rows: |
          select concat('01UNIT', lpad(cast(id as string), 19, '0')) as event_id, cast(0.9 as double) as relevance_score, 'a report' as description,
                 cast(timestamp'2026-06-01 00:00:00' as timestamp) as arrival_ts
          from range(150) as t(id)
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 100000}
