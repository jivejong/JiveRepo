          - {sector_id: "tatooine", channel: "kyber", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "tatooine", channel: "dark_side", mean_90d: 0.0, stddev_90d: 1.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 200000}
    expect:
      rows:
        - {sector_id: "tatooine", imbalance_score: 2.0}

  - name: unit_test_imbalance_score_dark_only_stealth_row
    description: "z_dark = 2.0 only, channels_present = 1: SQRT(2 * 4) * SQRT(3/1) = SQRT(8) * SQRT(3) = SQRT(24) ~= 4.89898."
    model: gold_sector_reading
    overrides:
