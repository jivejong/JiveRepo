      - input: ref('silver_probe_reading')
        rows:
          - {event_id: "01UNIT0000000000000000110", sector_id: "coruscant", scan_id: "01UNIT0000000000000000111", event_time: "2026-09-30T12:00:00Z", midichlorian_ppm: 0.0, kyber_resonance: 0.0, dark_side_activity: 2.0, channels_present: 3}
      - input: ref('gold_sector_baseline')
        rows:
          - {sector_id: "coruscant", channel: "midichlorian", mean_90d: 0.0, stddev_90d: 1.0}
