      channels_present must also be < 3 -- a full reading with the same z-scores never classifies
      veiled_presence. Population kept low (unlike the other naboo fixtures above) so civil_unrest's own
      z_dark > 1.5 AND population > 1e9 AND ABS(z_kyber) < 1.5 rule -- an earlier rule in doc 03's order --
      can't also fire on this row and mask what's actually being tested here.
