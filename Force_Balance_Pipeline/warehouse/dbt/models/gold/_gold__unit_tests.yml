      - input: ref('gold_sector_baseline')
        rows:
          - {sector_id: "tatooine", channel: "midichlorian", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "tatooine", channel: "kyber", mean_90d: 0.0, stddev_90d: 1.0}
          - {sector_id: "tatooine", channel: "dark_side", mean_90d: 0.0, stddev_90d: 1.0}
      - input: ref('dim_sector')
        rows:
          - {sector_id: "tatooine", population: 200000}
    expect:
      rows:
        - {sector_id: "tatooine", signature: "dark_adept"}

