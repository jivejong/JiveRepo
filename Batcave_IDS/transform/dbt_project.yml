name: "batcave_ids"
version: "1.0.0"
config-version: 2

profile: "batcave_ids"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Resolved relative to dbt's working directory (transform/), so `make
# transform` and CI both cd here first.
vars:
  data_root: "../data"

  # Minimum streak length for each "runs" evidence feature (docs/02's [def]
  # ambiguity flags). "Runs" means maximal streaks of consecutive requests, and
  # each feature counts the RUNS, not the matching requests. Thresholds are
  # pinned here rather than inline so the basis is one place; the observed
  # distribution behind each is recorded in docs/02-data-model.md.
  auth_failure_run_min_length: 3
  path_enumeration_run_min_length: 3
  sensitive_access_run_min_length: 2

  # assert_probability_calibration. docs/02: "techniques with 30+ attempts".
  calibration_min_attempts: 30
  # Band width in binomial standard errors, not an absolute gap - see the test
  # for why a flat band is the wrong shape. 3 sigma is ~99.7%, which does not
  # false-positive across the 11 techniques that clear the attempt threshold
  # (worst observed: z=2.08) while still tightening the bound as n grows.
  calibration_sigma: 3.0
  calibration_absolute_floor: 0.02

  # assert_twoface_test_is_not_vacuous. Minimum fraction of Two-Face sessions
  # that must have made a traffic-producing attempt, guarding the duplicate-
  # survival test's scoping against degrading to an empty, trivially-passing
  # set. 92% qualified on the Phase 6 seeded corpus; 0.5 is a regression
  # floor, not a tight fit.
  twoface_min_qualifying_fraction: 0.5

  # mart_threat_scores. docs/02: "Triage threshold >= 60, as a dbt variable."
  triage_threshold: 60

# No directory-level +tags. staging/ holds both triage_input and
# ground_truth models (docs/02-data-model.md) — a directory default would
# encode exactly the leakage the project exists to prevent. Every model
# gets its own tag in its own config block, starting Phase 5.
#
# Tables, not views, and deliberately so. A view over read_parquet() stores
# the glob as text and re-resolves it against whatever process opens the
# warehouse — so `../data/raw/...` works from transform/ and breaks from
# anywhere else. Phase 6's triage service and Phase 7's Dagster both open
# this file from a different working directory. Materializing as tables bakes
# the data in and keeps data/warehouse.duckdb self-contained. The dataset is
# small enough that the cost is irrelevant.
models:
  batcave_ids:
    +materialized: table
