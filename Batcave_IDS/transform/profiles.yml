# Kept inside the dbt project (not ~/.dbt/profiles.yml) so the project is
# portable: run dbt with --profiles-dir . (or DBT_PROFILES_DIR set to this
# directory) from a fresh clone with no machine-level setup.
batcave_ids:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/warehouse.duckdb
      threads: 4
      settings:
        # Not optional. `received_at` lands as TIMESTAMP WITH TIME ZONE and
        # DuckDB renders those in the session's local zone, so every hour
        # comparison against the `hour=` Hive partition is silently wrong
        # anywhere but UTC. Found in Phase 4 (docs/06, services/consumer/
        # landing_check.py) where it made an otherwise-correct partition check
        # fail on all 2,592 rows.
        TimeZone: "UTC"
