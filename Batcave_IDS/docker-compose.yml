services:
  redpanda:
    image: redpandadata/redpanda:v26.2.2
    container_name: batcave-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092" # Kafka API (host-facing), per docs/05-local-environment.md
      - "18081:18081" # Schema Registry
      - "9644:9644" # Admin API, used by console and healthcheck
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redpanda-console:
    image: redpandadata/console:v3.11.0
    container_name: batcave-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8080:8080"

  honeypot:
    build:
      context: .
      dockerfile: services/honeypot/Dockerfile
    container_name: batcave-honeypot
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC: attack.events
      SESSION_GAP_SECONDS: ${SESSION_GAP_SECONDS:-120}
      # Trusted only on the compose-internal network, where the simulator is
      # the only thing that can reach this service (docs/02, Phase 1 plan).
      HONEYPOT_TRUST_FORWARDED_FOR: "true"
    healthcheck:
      # No curl in python:3.11-slim; urllib avoids adding a dependency just
      # for this. Found the hard way in Phase 2: without a real healthcheck
      # here, `docker compose up --wait` reported this service healthy while
      # it was actually crash-looping on a missing module.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "8000:8000"

  consumer:
    build:
      context: .
      dockerfile: services/consumer/Dockerfile
    container_name: batcave-consumer
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      KAFKA_TOPIC: attack.events
      CONSUMER_GROUP: attack-events-writer
      CONSUMER_FLUSH_MAX_MESSAGES: ${CONSUMER_FLUSH_MAX_MESSAGES:-5000}
      CONSUMER_FLUSH_INTERVAL_S: ${CONSUMER_FLUSH_INTERVAL_S:-30}
    volumes:
      # Landed Parquet must appear on the host for DuckDB and dbt to read
      # without a copy step (docs/05). DATA_ROOT=/app/data is set in the image.
      - ./data:/app/data
    # No healthcheck: this service has no endpoint to probe, and a liveness
    # probe that only proves the process exists would say nothing about whether
    # it is committing offsets. `make landing-check` is the real check.
    #
    # No restart policy, deliberately. `restart: unless-stopped` would bring the
    # container straight back after `docker kill`, leaving no window to inspect
    # the committed offsets before the replay — which is the whole observation
    # the consumer-restart exercise depends on (docs/exercises.md).

volumes:
  redpanda-data:
