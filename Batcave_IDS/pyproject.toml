[project]
name = "batcave-ids"
version = "0.1.0"
description = "Streaming intrusion-simulation pipeline with evaluated LLM triage."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dagster>=1.8",
    "dagster-dbt>=0.24",
    "dagster-duckdb>=0.24",
    # Pinned exactly to the installed dagster version, not left floating like
    # the three lines above: `dagster dev` refuses to start without this
    # package ("dagster-webserver must be installed"), it tracks dagster's
    # own version closely, and a drift between the two is a confusing
    # startup failure rather than an install-time one. Runtime, not dev: it
    # is `make dagster`, in the README Quickstart and the clean-clone
    # checkpoint.
    "dagster-webserver==1.13.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "google-genai==2.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "sqlfluff>=4.3",
    # Lints the SQL dbt actually compiles (macros expanded, refs resolved)
    # rather than the raw templated text. Two pins that matter: it must match
    # sqlfluff's own major/minor exactly (it is a plugin, versioned in
    # lockstep), and it imports dbt's internals, so it must be upgraded
    # together with dbt-core. A mismatch on either fails confusingly.
    # See docs/05-local-environment.md.
    "sqlfluff-templater-dbt>=4.3,<4.4",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
