[project]
name = "batcave-ids"
version = "0.1.0"
description = "Streaming intrusion-simulation pipeline with evaluated LLM triage."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "dagster>=1.8",
    "dagster-dbt>=0.24",
    "dagster-duckdb>=0.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "groq>=0.11",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "sqlfluff>=3.1",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
