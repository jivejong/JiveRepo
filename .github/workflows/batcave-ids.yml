name: batcave-ids CI

on:
  push:
    paths: ["Batcave_IDS/**"]
  pull_request:
    paths: ["Batcave_IDS/**"]

defaults:
  run:
    working-directory: Batcave_IDS

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # sqlfluff is NOT here. It uses the dbt templater, which needs a compiled
      # project, so it runs in the dbt job after `dbt deps`/`dbt compile`
      # rather than duplicating those steps in this parallel job.

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - run: uv run pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync
      - name: dbt deps
        working-directory: Batcave_IDS/transform
        run: uv run --project .. dbt deps
      - name: dbt compile
        working-directory: Batcave_IDS/transform
        run: uv run --project .. dbt compile --profiles-dir .

      # After compile: the dbt templater lints the SQL dbt actually produces,
      # with macros expanded and refs resolved.
      - name: sqlfluff lint
        working-directory: Batcave_IDS/transform
        run: uv run --project .. sqlfluff lint models --dialect duckdb

      # Named deliberately so a reader sees the invariant in the CI log
      # (docs/02). It walks target/manifest.json rather than checking column
      # names, because a column check is defeated by a rename — and it runs
      # against a compiled project, so it needs no warehouse data.
      - name: assert_no_ground_truth_leakage
        working-directory: Batcave_IDS
        run: uv run pytest tests/test_no_ground_truth_leakage.py -v
