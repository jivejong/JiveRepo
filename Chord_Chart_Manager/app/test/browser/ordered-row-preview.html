<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ordered row preview</title></head>
<body>
  <main><div id="chart"></div><div id="adjacent-chart"></div></main>
  <script type="module">
    try {
      await import('/chartParser.js');
      const React = await import('react');
      const { createRoot } = await import('react-dom/client');
      const { renderChart } = await import('/src/lib/chartRenderer.jsx');
      const { parseChartBody, transposeDecoratedRawLines } = await import('/src/lib/chartParser.js');
      const { shouldIgnoreChartRowSwipe } = await import('/src/lib/chartSwipe.js');
      const { useSwipe } = await import('/src/hooks.js');
      const source = '[Verse]  C - G/D  (4x)  \n  abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN  \n[Chorus] C - G - D/G5x\n  second lyric  \n[Adjacent] C G\n  xy  ';
      const chart = parseChartBody(source);
      const root = createRoot(document.getElementById('chart'));
      function SwipeHarness({ content, original }) {
        const handlers = useSwipe(() => { window.swipeNavigationCount = (window.swipeNavigationCount || 0) + 1; },
          () => { window.swipeNavigationCount = (window.swipeNavigationCount || 0) + 1; }, 60,
          shouldIgnoreChartRowSwipe);
        return React.createElement('div', handlers, renderChart(content, original));
      }
      const renderSwipeChart = (content, original = content) =>
        root.render(React.createElement(SwipeHarness, { content, original }));
      renderSwipeChart(chart);
      const adjacentSource = 'C G';
      const adjacentChart = { sections: [{ label: null, lines: [
        { type: 'raw', text: adjacentSource, paired_to_next: true, chord_spans: [
          { symbol: 'C', start: 0, end: 1 }, { symbol: 'G', start: 2, end: 3 },
        ] },
        { type: 'lyric', text: '  abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMN  ', chords: [] },
      ] }] };
      const adjacentRoot = createRoot(document.getElementById('adjacent-chart'));
      adjacentRoot.render(renderChart(adjacentChart));
      window.previewState = { source, chart, root, renderChart, transposeDecoratedRawLines,
        renderSwipeChart, adjacentSource, adjacentChart, adjacentRoot };
      window.previewReady = true;
    } catch (error) {
      window.previewError = String(error?.stack || error);
      window.previewReady = false;
    }
  </script>
</body>
</html>
